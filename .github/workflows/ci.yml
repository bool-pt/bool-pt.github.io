name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Run JS actions (incl. ones bundled transitively, e.g. inside
  # upload-pages-artifact) on Node 24 — silences the Node 20 deprecation
  # warning. Remove once all actions default to Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # Lint, typecheck and test share one install and run in parallel via Turbo
  # (was three separate jobs, each paying a full `pnpm install`).
  verify:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - name: Lint, typecheck and test
        run: pnpm exec turbo run lint typecheck test --continue
      - name: Dead-code check (knip)
        run: pnpm knip
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: packages/*/coverage/
          if-no-files-found: ignore

  build:
    name: Build
    # No dependency on `verify` — build runs in parallel with lint/typecheck/test
    # so it (and e2e, which needs it) aren't gated behind the verify job. A failing
    # verify still blocks the PR independently.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      # Persist Astro's sharp image-optimization cache so unchanged images
      # aren't re-encoded every run (the case-study set is large).
      - name: Cache Astro image optimization
        uses: actions/cache@v4
        with:
          path: apps/web/bool/node_modules/.astro
          key: astro-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: astro-cache-${{ runner.os }}-
      - name: Build all packages and apps
        run: pnpm build
        env:
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
          PUBLIC_SENTRY_DSN: ${{ vars.PUBLIC_SENTRY_DSN }}
      - name: Merge json-editor into main site output
        run: |
          test -d apps/web/json-editor/dist || { echo "::error::json-editor build output missing — aborting merge"; exit 1; }
          cp -r apps/web/json-editor/dist apps/web/bool/dist/json-editor
      # Reused by the e2e job so it doesn't rebuild the whole site from scratch.
      - name: Upload built site
        uses: actions/upload-artifact@v6
        with:
          name: site-dist
          path: apps/web/bool/dist
          retention-days: 1
          include-hidden-files: true

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Reuse the build job's output instead of rebuilding (astro preview serves dist).
      - name: Download built site
        uses: actions/download-artifact@v6
        with:
          name: site-dist
          path: apps/web/bool/dist
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browsers + OS deps
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright OS deps (browsers cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Run E2E tests
        run: pnpm test:e2e
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
