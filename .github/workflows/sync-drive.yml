name: Sync from Google Drive

on:
  workflow_dispatch:

concurrency:
  group: sync-drive
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync Drive → media + locales
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Sync from Google Drive
        id: sync
        run: pnpm --filter @bool/media sync:drive
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_FOLDER_ID || secrets.GOOGLE_DRIVE_FOLDER_ID }}

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          commit-message: 'chore(media): sync media and locales from Google Drive'
          title: 'chore(media): sync media and locales from Google Drive'
          body: |
            Automated sync from the shared Google Drive folder.

            - Media images updated in `packages/media/images/`
            - Locale files updated in `packages/i18n/src/locales/`
            - Blog frontmatter image paths rewritten if media was reorganized

            ${{ steps.sync.outputs.warnings }}

            Triggered by @${{ github.actor }} via the **Sync from Google Drive** workflow.
          branch: chore/sync-drive
          delete-branch: true
          add-paths: |
            packages/media/images/
            packages/media/.drive-manifest.json
            packages/i18n/src/locales/
            packages/content/data/blog/
